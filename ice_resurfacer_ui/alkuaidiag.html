<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alkuAI UI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- <span class="material-icons" style="color: #00e676; vertical-align: middle;">check_circle</span> -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
</head>
<body>
    <img src="alkuAIlogocrop.png" id="brand-logo" alt="Zamboni Logo">

    <div id="system-clock">--/--/---- --:--:--</div>

    <h1>alkuAI Autopilot™</h1>

    <div class="dashboard">
        
        <div class="panel alarm-panel">
            <div class="alarm-header">
                <span>Hälytys</span>
                <span>Lähde</span>
            </div>
            <ul class="alarm-list" id="alarm-list">
                <li><span>Ei hälytyksiä</span><span> </span></li>
            </ul>
        </div>
    </div>
    <footer>
        <p>© 2026 alkuAI</p>
    </footer>
    <script src="app.js"></script>
    
</body>

</html>
