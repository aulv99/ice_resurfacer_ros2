<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>alkuAI UI</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- <span class="material-icons" style="color: #00e676; vertical-align: middle;">check_circle</span> -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/eventemitter2@6.4.9/lib/eventemitter2.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
</head>
<body>
    <img src="alkuAIlogocrop.png" id="brand-logo" alt="Zamboni Logo">

    <div id="system-clock">--/--/---- --:--:--</div>

    <h1>alkuAI Autopilot™</h1>

    <div class="nav-bar">
        <button class="nav-btn active" onclick="switchView('view-main')">Etusivu</button>
        <button class="nav-btn" onclick="switchView('view-alarms')">Hälytykset</button>
        <button class="nav-btn" onclick="switchView('view-charts')">Kaaviot</button>
    </div>

    <div id="view-main" class="view-section">
        <div class="dashboard">
        
            <div class="panel">
                <div class="chart-container">
                    <canvas id="positionChart"></canvas>
                </div>
                <div class="chart-container">
                    <canvas id="velocityChart"></canvas>
                </div>
            </div>

            <div class="panel">
                <table class="measurement-table">
                    <tr><td>Aktiivinen nopeusohjaus</td><td id="val-lin-vel">0.0 m/s</td></tr>
                    <tr><td>Jääkoneen nopeus</td><td id="val-fb-vel">0.0 rad/s</td></tr>
                    <tr><td>Vesiventtiiliin asento</td><td id="val-valve">0%</td></tr>
                    <tr><td>Jäähöylän pyörintä</td><td id="val-auger">0.0 rad/s</td></tr>
                    <tr><td>Vesisäiliö</td><td id="val-water">100%</td></tr>
                    <tr><td>Jäädyttimen asento</td><td id="val-cond">Ylhällä</td></tr>
                    <tr><td>Autopilotin tila</td><td id="val-nav">Ok</td></tr>
                    <tr><td>Vaihe</td><td id="val-op">Valmiudessa</td></tr>
                    <!-- <tr><td>Engine Temperature</td><td id="val-eng-temp">80 °C</td></tr>
                    <tr><td>Ambient Temperature</td><td id="val-amb-temp">5 °C</td></tr>
                    <tr><td>Oil Temperature</td><td id="val-oil-temp">60 °C</td></tr> -->
                </table>
            </div>

            <div class="panel alarm-panel">
                <div class="alarm-header">
                    <span>Järjestelmäviestit</span>
                </div>
            <ul class="terminal-list" id="terminal-list">
                </ul>
            </div>
        </div>
    </div>

    <div id="view-alarms" class="view-section" style="display: none;">
        <!-- Move your big alarm panel here -->
        <div class="panel" style="height: 500px;">
            <div class="alarm-header">
                <span>Aika  Hälytys</span>
                <span>Lähde</span>
            </div>
            <ul class="alarm-list" id="alarm-list">
                <li><span>Ei hälytyksiä</span><span> </span></li>
            </ul>
        </div>
    </div>

    <div id="view-charts" class="view-section" style="display: none;">
        <!-- Move your big alarm panel here -->
        <div class="panel" style="height: 500px;">
            <div class="chart-container" style="height: 100%;">
                <canvas id="multiTrendChart"></canvas>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2026 alkuAI</p>
    </footer>
    <script src="app.js"></script>
    
</body>

</html>
